<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let expenses = [];
        let nextId = 1;

        const addExpense = (title, amount, category) => {
            if (!title?.trim() || typeof amount !== 'number' || amount <= 0 || !category?.trim()) {
                return console.log('❌ Ошибка: Некорректные данные');
            }
            const expense = { id: nextId++, title: title.trim(), amount, category: category.trim() };
            expenses.push(expense);
            console.log(` Добавлено: ${expense.title} - ${expense.amount}₽ (${expense.category})`);
            return expense;
        };

        const printAllExpenses = () => {
            console.log('все расходы');
            expenses.length === 0 
                ? console.log('Нет расходов')
                : expenses.forEach(e => console.log(`${e.id}. ${e.title.padEnd(20)} ${e.amount}₽ ${e.category}`));
        };

        const getTotalAmount = () => {
            const total = expenses.reduce((s, e) => s + e.amount, 0);
            console.log(`Всего: ${expenses.length} расходов, сумма: ${total}₽`);
            return total;
        };

        const getExpensesByCategory = (category) => {
            const filtered = expenses.filter(e => e.category.toLowerCase() === category?.toLowerCase());
            const total = filtered.reduce((s, e) => s + e.amount, 0);
            console.log(`\n${category}: ${filtered.length} расходов, ${total}₽`);
            filtered.forEach(e => console.log(`   • ${e.title}: ${e.amount}₽`));
            return filtered;
        };

        const findExpenseByTitle = (search) => {
            const found = expenses.find(e => e.title.toLowerCase().includes(search?.toLowerCase()));
            if (!found) return console.log(`❌ "${search}" не найден`);
            console.log(` Найден: ${found.title} - ${found.amount}₽`);
            found.title += ` (поиск: ${search})`;
            return found;
        };

        const expenseTracker = {
            expenses,
            currentIndex: 0,
            
            next() {
                if (!expenses.length) return console.log('❌ Нет расходов');
                this.currentIndex = (this.currentIndex + 1) % expenses.length;
                console.log(`👉 ${expenses[this.currentIndex].title}`);
            },
            
            addExpense,
            getTotalAmount,
            getExpensesByCategory,
            findExpenseByTitle,
            
            deleteExpenseById(id) {
                const index = expenses.findIndex(e => e.id === id);
                if (index === -1) return console.log(`❌ ID ${id} не найден`);
                const deleted = expenses.splice(index, 1)[0];
                console.log(` Удалено: ${deleted.title}`);
                this.currentIndex = Math.min(this.currentIndex, expenses.length - 1) || 0;
            },
            
            getCategoryStatistics() {
                console.log('статискика');
                const stats = expenses.reduce((acc, e) => {
                    acc[e.category] = acc[e.category] || { count: 0, total: 0 };
                    acc[e.category].count++;
                    acc[e.category].total += e.amount;
                    return acc;
                }, {});
                Object.entries(stats).forEach(([cat, { count, total }]) => 
                    console.log(`${cat}: ${count} шт, ${total}₽, средний ${Math.round(total/count)}₽`));
            }
        };

        addExpense('Обед', 350, 'Еда');
        addExpense('Такси', 500, 'Транспорт');
        addExpense('Кофе', 150, 'Еда');
        printAllExpenses();
        getTotalAmount();
        getExpensesByCategory('Еда');
        findExpenseByTitle('Кофе');
        expenseTracker.deleteExpenseById(2);
        expenseTracker.getCategoryStatistics();
    </script>
</body>
</html>
